# Render Blueprint — Strapi CMS + PostgreSQL
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lumea-strapi
    runtime: node
    plan: free
    rootDir: cms
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /admin
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "1337"
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: lumea-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  - name: lumea-postgres
    plan: free
    databaseName: lumea
    user: strapi
