services:
  postgres:
    image: postgres:16-alpine
    container_name: lumea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumea
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5433:5432"
    volumes:
      - lumea_pg_data:/var/lib/postgresql/data

volumes:
  lumea_pg_data:
